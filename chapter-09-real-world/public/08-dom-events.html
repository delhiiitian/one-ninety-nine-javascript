<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>8. DOM events</title>
  <style>
    .done { text-decoration: line-through; color: gray; }
    .error { color: crimson; }
  </style>
</head>
<body>
  <h1>To-do list</h1>
  <form id="todo-form">
    <input id="todo-input" placeholder="What needs doing?" autocomplete="off">
    <button type="submit">Add</button>
  </form>
  <p id="message" aria-live="polite"></p>
  <ul id="todos"></ul>
  <p>Remaining: <span id="remaining">0</span></p>
  <script type="module" src="08-dom-events.js"></script>
</body>
</html>
